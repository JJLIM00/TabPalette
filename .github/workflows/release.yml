# Publishes a new version when a version tag is pushed, e.g. `v0.1.1`:
#   1. waits for the CI run of the tagged commit (started when it was pushed to master)
#      instead of running the same checks a second time; runs them itself only when
#      that commit has no CI run,
#   2. checks that the tag matches "version" in package.json,
#   3. builds the .vsix and publishes it to the VS Code Marketplace,
#   4. creates a GitHub Release with the notes from CHANGELOG.md and the .vsix attached.
#
# Publishes with Marketplace Trusted Publishing
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  # The tagged commit is normally pushed to master first, so CI is already checking it.
  # Wait for that run's result rather than repeating the same checks.
  ci-result:
    runs-on: ubuntu-latest
    permissions:
      actions: read # to find and follow the CI run
    outputs:
      found: ${{ steps.find.outputs.found }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Find the CI run of this commit
        id: find
        run: |
          # When the commit and the tag are pushed together, the CI run can take a moment to appear.
          for attempt in $(seq 1 12); do
            id=$(gh run list --workflow ci.yml --event push --commit "${GITHUB_SHA}" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "${id}" ]; then
              echo "CI run: ${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${id}"
              echo "id=${id}" >> "$GITHUB_OUTPUT"
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "No CI run for this commit (it was not pushed to master), so the release runs the checks itself."
          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Wait for the CI run to pass
        if: steps.find.outputs.found == 'true'
        run: gh run watch "${{ steps.find.outputs.id }}" --exit-status --interval 15 > /dev/null

  # Only for a tag on a commit that CI never checked.
  checks:
    needs: ci-result
    if: needs.ci-result.outputs.found == 'false'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci-result, checks]
    # Publish when the CI run passed (checks skipped), or when the release's own checks passed.
    if: ${{ !cancelled() && needs.ci-result.result == 'success' && (needs.checks.result == 'success' || needs.checks.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release
      id-token: write # to prove to the Marketplace that this workflow is publishing (Trusted Publishing)
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/* # the newest Node.js LTS release
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in package.json. Bump the version, commit, then tag v${version}."
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: |
          # The lines under "## <version>", up to the next "## " heading.
          awk -v v="## ${VERSION}" '$0 == v {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::error::CHANGELOG.md has no \"## ${VERSION}\" section. Add the release notes there first."
            exit 1
          fi

      - name: Package
        run: pnpm run vsix

      - name: Publish to the VS Code Marketplace
        run: pnpm exec vsce publish --oidc --no-dependencies --packagePath "tabpalette-${VERSION}.vsix"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "tabpalette-${VERSION}.vsix" --title "TabPalette ${VERSION}" --notes-file "$RUNNER_TEMP/release-notes.md"
