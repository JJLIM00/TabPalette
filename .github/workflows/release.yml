# Publishes a new version when a version tag is pushed, e.g. `v0.1.1`:
#   1. runs the same checks as CI (Windows, Linux, macOS),
#   2. checks that the tag matches "version" in package.json,
#   3. builds the .vsix and publishes it to the VS Code Marketplace,
#   4. creates a GitHub Release with the notes from CHANGELOG.md and the .vsix attached.
#
# Publishes with Marketplace Trusted Publishing
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release
      id-token: write # to prove to the Marketplace that this workflow is publishing (Trusted Publishing)
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/* # the newest Node.js LTS release
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in package.json. Bump the version, commit, then tag v${version}."
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: |
          # The lines under "## <version>", up to the next "## " heading.
          awk -v v="## ${VERSION}" '$0 == v {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::error::CHANGELOG.md has no \"## ${VERSION}\" section. Add the release notes there first."
            exit 1
          fi

      - name: Package
        run: pnpm run vsix

      - name: Publish to the VS Code Marketplace
        run: pnpm exec vsce publish --oidc --no-dependencies --packagePath "tabpalette-${VERSION}.vsix"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "tabpalette-${VERSION}.vsix" --title "TabPalette ${VERSION}" --notes-file "$RUNNER_TEMP/release-notes.md"
