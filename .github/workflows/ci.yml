# Checks every push and pull request: type-check, lint, bundle, and run the unit and
# integration tests in a real VS Code, on Windows, Linux and macOS. Also checks that the
# extension packages into a .vsix. (The UI tests, `pnpm run test:ui`, are run locally.)
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call: # the release workflow runs these same checks first

# A newer push to the same branch cancels the checks still running for the older one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: lts/* # the newest Node.js LTS release
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The VS Code copy the tests run in (downloaded once, then reused).
      - uses: actions/cache@v6
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # `pnpm test` also type-checks, bundles and lints first (the "pretest" script).
      - name: Unit and integration tests
        if: runner.os != 'Linux'
        run: pnpm test

      - name: Unit and integration tests (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test

      - name: Package
        run: pnpm run vsix
